name: Build 비밀번호 금고 (macOS)

# macOS 러너에서 앱을 빌드합니다.
# Xcode 없이 앱 파일 하나만 받아 쓸 수 있게 하는 것이 목적입니다.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    # 어딘가에서 멈춰 서더라도 러너를 몇 시간씩 붙들지 않게 합니다.
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: 도구 버전 확인
        run: |
          sw_vers
          swift --version

      - name: 단위 테스트
        run: swift test

      - name: 앱 빌드
        run: ./Scripts/build-app.sh

      - name: 빌드 결과 검증
        # 여기서 통과하지 못하면 배포하지 않습니다.
        # "빌드가 됐다" 와 "금고가 제대로 잠기고 열린다" 는 다른 문제입니다.
        run: |
          set -e
          APP="build/PasswordVault.app"

          test -x "$APP/Contents/MacOS/PasswordVault" || { echo "실행 파일이 없습니다"; exit 1; }
          test -f "$APP/Contents/Info.plist" || { echo "Info.plist 가 없습니다"; exit 1; }

          echo "--- 지원 아키텍처 ---"
          lipo -info "$APP/Contents/MacOS/PasswordVault"

          echo "--- 서명 확인 ---"
          codesign -dv "$APP" 2>&1 || echo "서명 정보를 읽지 못했습니다(치명적이지 않음)"

          echo "--- 자체 검사 ---"
          "$APP/Contents/MacOS/PasswordVault" --selftest

      - name: 압축
        # ditto 로 압축해야 서명과 심볼릭 링크가 그대로 보존됩니다.
        run: |
          cp README.md build/사용법.md
          ditto -c -k --keepParent build/PasswordVault.app build/PasswordVault-macOS.zip
          ls -lh build

      - name: 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: password-vault-macos
          path: |
            build/PasswordVault-macOS.zip
            build/사용법.md
          if-no-files-found: error

      - name: 예전 릴리스 파일 정리
        # 파일 이름이 바뀌면 옛 이름의 파일이 릴리스에 그대로 남아
        # 어느 것을 받아야 하는지 헷갈리게 됩니다. 지금 올릴 것만 남깁니다.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: python3 Scripts/prune-release-assets.py password-vault-latest PasswordVault-macOS.zip

      - name: 릴리스 게시
        # 릴리스가 있으면 로그인 없이 바로 내려받을 수 있는 링크가 생깁니다.
        # 저장소 토큰 권한이 읽기 전용이면 실패할 수 있으므로 실패해도 빌드는 통과시킵니다.
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: password-vault-latest
          name: 비밀번호 금고 (최신)
          body: |
            맥에서 쓰는 비밀번호 관리 앱입니다. 1Password 처럼 마스터 비밀번호 하나로 나머지를 지킵니다.

            **`PasswordVault-macOS.zip` 을 내려받아 압축을 풀고, `PasswordVault.app` 을 `응용 프로그램` 으로 옮기세요.**

            처음 열 때 macOS 가 **"확인되지 않은 개발자"** 라며 막으면,
            앱을 **마우스 오른쪽 클릭 → 열기 → 열기** 를 누르세요.
            그래도 열리지 않으면 터미널에서 아래 한 줄을 실행한 뒤 다시 열면 됩니다.

            ```
            xattr -dr com.apple.quarantine /Applications/PasswordVault.app
            ```

            서명된 개발자 계정이 없어서 나오는 경고이며, 앱 자체는 인터넷에 아무것도 보내지 않습니다.

            - macOS 13(벤투라) 이상
            - 인텔·애플실리콘 모두 지원
          files: build/PasswordVault-macOS.zip
          prerelease: false
          make_latest: true
